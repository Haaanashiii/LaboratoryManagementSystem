server {
    listen 80;
    server_tokens off;

    # Security headers (A02:2025 — Security Misconfiguration)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-src 'self' blob:; frame-ancestors 'none';" always;

    # Block dotfiles — .git, .env, .htpasswd, .htaccess
    location ~ /\.(git|env|htpasswd|htaccess) {
        return 404;
    }

    # Block SQL dumps and archive files
    location ~* \.(sql|bak|zip|gz|tar)$ {
        return 404;
    }

    # Block known admin tools, DB managers, and reconnaissance bait paths
    location ~* ^/(phpmyadmin|adminer|wp-admin|wp-login|phpinfo\.php|xmlrpc\.php|actuator|swagger|graphiql|webadmin|administrator|backup) {
        return 404;
    }

    # Never cache index.html — ensures browser picks up new JS/CSS after every rebuild
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS/fonts/images — safe to cache long-term (filenames change on rebuild)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve React SPA — unknown paths fall back to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to backend container
    # ^~ stops nginx checking regex locations (like the static-file rule) for /api/* paths
    location ^~ /api {
        client_max_body_size 10m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.io — must upgrade HTTP → WebSocket
    location ^~ /socket.io {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded file assets (images, PDFs stored in backend/uploads)
    # ^~ ensures /uploads/*.jpg etc. are proxied, not served from /usr/share/nginx/html
    location ^~ /uploads {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Health check endpoint (backend mounts this at /health, not /api/health)
    location ^~ /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
